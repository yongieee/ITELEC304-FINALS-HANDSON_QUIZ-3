<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Display System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-width: 4px;
            --card-shadow: 8px 8px 0 0 #000000;
            --accent-color: #000000;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-container {
            border: var(--border-width) solid var(--text-color);
            padding: 20px 40px;
            box-shadow: var(--card-shadow);
            margin-bottom: 50px;
            background-color: #fff;
            width: fit-content;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1000px;
        }

        .product-card {
            border: var(--border-width) solid var(--text-color);
            padding: 24px;
            box-shadow: var(--card-shadow);
            background-color: #fff;
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0 0 #000000;
        }

        .product-card::before {
            content: "★";
            position: absolute;
            top: -15px;
            left: -15px;
            background: #fff;
            border: var(--border-width) solid var(--text-color);
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .product-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .product-price {
            font-size: 1.25rem;
            background-color: #000;
            color: #fff;
            display: inline-block;
            padding: 4px 12px;
            font-weight: 700;
            width: fit-content;
        }

        .info-box {
            margin-top: 15px;
            padding: 10px;
            border: 2px solid #000;
            background-color: #eee;
            display: none;
            font-weight: 700;
        }

        .show-info .info-box {
            display: block;
            animation: slideDown 0.2s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-info-btn {
            margin-top: 20px;
            display: block;
            width: fit-content;
            padding: 10px 20px;
            background-color: var(--text-color);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .product-info-btn:active {
            transform: translate(2px, 2px);
        }

        .empty-message {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.5rem;
            padding: 40px;
            border: var(--border-width) dashed var(--text-color);
        }
    </style>
</head>

<body>
    <div class="header-container">
        <h1>Online Products</h1>
    </div>

    <div class="product-grid">
        {% for product in products %}
        <div class="product-card" id="card-{{ product.id }}">
            <div class="product-name">{{ product.name }}</div>
            <div class="product-price">₱{{ product.price }}</div>
            <div class="info-box">
                {{ product.product_info }}
            </div>
            <button class="product-info-btn" onclick="toggleInfo({{ product.id }})">
                Read More »
            </button>
        </div>
        {% empty %}
        <div class="empty-message">No products in stock right now.</div>
        {% endfor %}
    </div>

    <script>
        function toggleInfo(id) {
            const card = document.getElementById(`card-${id}`);
            const btn = card.querySelector('.product-info-btn');

            card.classList.toggle('show-info');

            if (card.classList.contains('show-info')) {
                btn.textContent = 'Show Less «';
            } else {
                btn.textContent = 'Read More »';
            }
        }
    </script>
</body>

</html>
